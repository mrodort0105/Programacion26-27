<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Profesional - Tu Nombre</title>
    <style>
        /* Estilos CSS básicos para una apariencia profesional y limpia */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9; /* Fondo gris claro */
            color: #333; /* Texto oscuro */
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            background-color: #ffffff; /* Fondo blanco para el contenido */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Sombra suave */
            border-radius: 8px;
        }

        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #007bff; /* Línea separadora azul */
            margin-bottom: 30px;
        }

        header h1 {
            color: #007bff; /* Título azul */
            margin-bottom: 5px;
        }

        .section-title {
            color: #333;
            border-left: 5px solid #007bff;
            padding-left: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .links-list {
            list-style: none;
            padding: 0;
        }

        .links-list li {
            margin-bottom: 10px;
        }
        
        /* Estilo para los enlaces de navegación */
        .links-list a {
            display: inline-block;
            text-decoration: none;
            color: #007bff; /* Texto azul para enlaces de navegación */
            padding: 5px 0;
            transition: color 0.3s ease;
        }
        
        .links-list a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        
        /* Estilo para los botones de portafolio/GitHub */
        .links-list a.button-link {
            color: #ffffff; /* Texto del botón blanco */
            background-color: #007bff; /* Fondo azul */
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .links-list a.button-link:hover {
            background-color: #0056b3; /* Azul más oscuro al pasar el ratón */
            text-decoration: none;
        }

        /* Estilo específico para los archivos de GitHub */
        .links-list a.github-link {
            background-color: #6a737d; /* Color gris/negro similar a GitHub */
        }

        .links-list a.github-link:hover {
            background-color: #444;
        }
        
        .blog-content {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>
